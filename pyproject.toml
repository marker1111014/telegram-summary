[project]
name = "telegram-summary"
version = "1.1.0"
description = "Telegram group summarizer bot deployed on Vercel"
requires-python = ">=3.12"
dependencies = [
    # Keep in sync with requirements.txt (local dev). Vercel installs from here.
    "python-telegram-bot==22.8",
    "google-generativeai==0.8.5",
    "python-dotenv==1.0.1",
    "upstash-redis==1.4.0",
    "fastapi==0.115.6",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "api.webhook:app"
